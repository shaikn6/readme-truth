[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-truth"
version = "0.1.0"
description = "Check that a README's claims (test counts, versions, paths, commands, links, licence, numbers) match the repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nagizaaz Shaik" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
readme-truth = "readme_truth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["readme_truth"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
